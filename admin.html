<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Digital Menu</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="brand">🍽️ AdminPanel</div>
            <ul>
                <li><a href="#add-item-section">Add Food Item</a></li>
                <li><a href="#orders-section">Live Orders</a></li>
                <li><a href="#feedback-section">Customer Feedback</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <h1>Dashboard Overview</h1>
                <div class="status-indicator">● System Online</div>
            </header>

            <!-- 1. Add Food Item Section -->
            <section id="add-item-section" class="admin-card">
                <h2>Add New Menu Item</h2>
                <form id="menuForm" class="grid-form">
                    <div class="input-group">
                        <label>Food Name</label>
                        <input type="text" id="foodName" placeholder="e.g. Garlic Bread" required>
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="foodCategory">
                            <option value="starters">Starters</option>
                            <option value="main course">Main Course</option>
                            <option value="drinks">Drinks</option>
                            <option value="desserts">Desserts</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="foodPrice" placeholder="299" required>
                    </div>
                    <div class="input-group">
                        <label>Type</label>
                        <select id="foodType">
                            <option value="veg">Veg</option>
                            <option value="non-veg">Non-Veg</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label>Image URL</label>
                        <input type="text" id="foodImage" placeholder="https://images.unsplash.com..." required>
                    </div>
                    <div class="input-group full-width">
                        <label>Description</label>
                        <textarea id="foodDesc" rows="3" placeholder="Briefly describe the dish..."></textarea>
                    </div>
                    <button type="submit" class="btn-add">Add to Menu</button>
                </form>
            </section>

            <!-- 2. Orders Management Section -->
            <section id="orders-section">
                <h2>Live Orders</h2>
                <div id="ordersGrid" class="cards-grid">
                    <p class="loading">Fetching live orders...</p>
                </div>
            </section>

            <!-- 3. Feedback Section -->
            <section id="feedback-section">
                <h2>Customer Feedback</h2>
                <div id="feedbackGrid" class="cards-grid">
                    <p class="loading">Loading feedback...</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>

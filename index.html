<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>The Digital Menu</h1>
            <p>Scan the QR at your table to re-order anytime!</p>
            <a href="#menu-section" class="btn-primary">View Menu</a>
        </div>
    </header>

    <div class="admin-note">
        <p><strong>Admin Note:</strong> Our menu is updated daily with fresh ingredients.</p>
    </div>

    <main id="menu-section" class="container">
        
        <div class="controls">
            <input type="text" id="searchBar" placeholder="Search for a dish...">
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="starters">Starters</button>
                <button class="filter-btn" data-category="main course">Main</button>
                <button class="filter-btn" data-category="drinks">Drinks</button>
                <button class="filter-btn" data-category="desserts">Desserts</button>
            </div>
        </div>

        <div class="menu-grid" id="menuGrid">
            </div>
    </main>

    <!-- Floating Cart Button -->
<button id="cartBtn" class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</button>

<!-- Cart Panel -->
<div id="cartPanel" class="cart-panel">
    <h2>Your Order</h2>
    <ul id="cartItems"></ul>
    <p><strong>Total: ₹<span id="cartTotal">0</span></strong></p>

    <input type="text" id="tableNumber" placeholder="Enter Table Number">

    <button id="placeOrderBtn">Place Order</button>
</div>

<!-- Feedback Section -->
<section class="feedback-section">
    <h2>Customer Feedback</h2>

    <input type="text" id="customerName" placeholder="Your Name">

    <select id="rating">
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
    </select>

    <textarea id="reviewText" placeholder="Write your feedback..."></textarea>

    <button id="submitFeedback">Submit Feedback</button>
</section>


    <footer>
        <p>&copy; 2026 The Digital Menu. All rights reserved.</p>
    </footer>
    <script type="module" src="script.js"></script>
    <script src="script.js"></script>
</body>
</html>
